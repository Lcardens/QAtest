name: CI - Pruebas de QAtest

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    on:
      push:
        branches: [ main ]
      workflow_dispatch:

    jobs:
      pruebas:
        runs-on: ubuntu-latest
        env:
          USUARIO_ADMIN: ${{ secrets.USUARIO_ADMIN }}
          CLAVE_ADMIN: ${{ secrets.CLAVE_ADMIN }}

        steps:
          - name: Descargar el codigo
            uses: actions/checkout@v4


    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Correr los tests con Maven
        run: mvn --batch-mode test -Dheadless=true

      - name: Subir reportes de fallo (para investigar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-surefire
          path: target/surefire-reports